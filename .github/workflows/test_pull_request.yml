name: Test pull request
on:
  pull_request:
  merge_group:

jobs:
  lint:
    permissions:
      contents: read
    name: lint.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run lint.sh
        run: ./deploy-scripts/lint.sh

  build:
    permissions:
      contents: read
    name: build.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build.sh
        run: ./deploy-scripts/build.sh

      - name: Save Docker image
        run: docker save "ludos-$GITHUB_SHA" | gzip > /tmp/ludos-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ludos-docker-image
          path: /tmp/ludos-image.tar.gz
          retention-days: 1

  test:
    needs: [lint, build]
    permissions:
      id-token: write
      contents: read
      packages: write
    name: test.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ludos-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/ludos-image.tar.gz

      - name: Run test.sh
        run: ./deploy-scripts/test.sh
        env:
          LUDOS_PALVELUKAYTTAJA_USERNAME: ${{ secrets.LUDOS_PALVELUKAYTTAJA_USERNAME }}
          LUDOS_PALVELUKAYTTAJA_PASSWORD: ${{ secrets.LUDOS_PALVELUKAYTTAJA_PASSWORD }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright/playwright-results/
          retention-days: 30
